---
name: PRune
description: Replace PR descriptions with before/after SHA and changed files

runs:
  using: composite
  steps:
    - name: Write description
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          const short = sha => sha.slice(0, 7);
          const compareUrl = `${context.payload.repository.html_url}/compare/${pr.base.sha}...${pr.head.sha}`;

          const files = await github.paginate(github.rest.pulls.listFiles, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number,
            per_page: 100,
          });

          const changedFiles = files
            .slice(0, 20)
            .map(f => `| \`${f.filename}\` | ${f.status} | ${f.additions} | ${f.deletions} |`);
          if (files.length > 20) {
            changedFiles.push(`| ${files.length - 20} more files | ... | ... | ... |`);
          }
          const rows = changedFiles.length
            ? changedFiles
            : ['| No file changes reported | ... | ... | ... |'];

          const newBody = [
            '## Summary',
            `${pr.title}`,
            '',
            '## Changes',
            '| File | Status | Additions | Deletions |',
            '| --- | --- | --- | --- |',
            ...rows,
            '',
            '## Base',
            `\`${pr.base.ref}\` at \`${short(pr.base.sha)}\``,
            '',
            '## Head',
            `\`${pr.head.ref}\` at \`${short(pr.head.sha)}\``,
            '',
            '## Compare',
            compareUrl,
            '',
            '---',
            '<img src="https://avatars.githubusercontent.com/u/283287531?s=16" width="16" alt=""> `coccinella-labs/prune@' + (github.action_ref || 'main') + '`',
          ].join('\n');

          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number,
            body: newBody,
          });

          core.info('PR #' + pr.number + ' description updated');
